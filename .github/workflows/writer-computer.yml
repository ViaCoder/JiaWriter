# Real desktop actions on real machines, one job per package: the packaged program installs the pinned driver itself,
# then reads, types and clicks in a real window of that system. Started by hand with a finished package run, so a
# first failure on a new system holds nothing else up.
name: JiaWriter computer use

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run of "JiaWriter packages" that built the files
        required: true

permissions:
  contents: read
  actions: read

jobs:
  computer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux-x64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-latest, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: windows-latest, platform: windows-x64 }
          - { runner: windows-11-arm, platform: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jiawriter-packages
          path: packages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify checksums and extract this platform's package
        shell: bash
        run: |
          set -euo pipefail
          # The files are the ones the package run signed off on.
          (cd packages && if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi)
          mkdir extracted
          if [[ "${{ matrix.platform }}" == windows-* ]]; then
            # Git's tar reads no zip and takes D: for a host, so PowerShell extracts, as in the package run.
            export ARCHIVE_PATH="$(cygpath -w "packages/jiawriter-${{ matrix.platform }}.zip")"
            export DESTINATION_PATH="$(cygpath -w extracted)"
            powershell.exe -NoProfile -NonInteractive -Command 'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
            binary="$(find extracted -name jiawriter.exe -type f | head -1)"
            # A Windows path, for the Windows Python that runs the check.
            echo "BINARY=$(cygpath -w "$PWD/$binary")" >> "$GITHUB_ENV"
          else
            tar -xJf "packages/jiawriter-${{ matrix.platform }}.tar.xz" -C extracted
            binary="$(find extracted -name jiawriter -type f -perm -u+x | head -1)"
            echo "BINARY=$PWD/$binary" >> "$GITHUB_ENV"
          fi

      - name: Install the test window's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 at-spi2-core python3-gi gir1.2-gtk-3.0 xdotool libxi6 libxkbcommon0

      - name: Real desktop actions
        shell: bash
        env:
          JW_TCC_SEED: ${{ runner.os == 'macOS' && format('{0}/scripts/computer-app/seed-macos-tcc.sh', github.workspace) || '' }}
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" -I scripts/writer-computer-check.py "$BINARY" 2>&1 | tee computer-check.log
          exit "${PIPESTATUS[0]}"

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: computer-check-${{ matrix.platform }}
          path: computer-check.log
          if-no-files-found: ignore
          retention-days: 14
